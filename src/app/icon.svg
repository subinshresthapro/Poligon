<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <!-- Dark background with rounded corners -->
  <rect width="28" height="28" rx="5" fill="#0A0A0A"/>
  <!-- Inner filled hexagon (brand indigo) — same shape as the navbar logo -->
  <polygon points="14,7 21,10 20,18 13,21 7,17 9,10" fill="#5560C8"/>
  <!-- Outer hexagon outline (wine red) -->
  <polygon points="14,2 25,8 25,20 14,26 3,20 3,8" fill="none" stroke="#6E2226" stroke-width="1.6" stroke-linejoin="miter"/>
</svg>
